services:
  backend:
    image: assilhammami/devopsrepository:latest
    ports:
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/projet?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=""
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - monitoring

  frontend:
    image: assilhammami/devopsrepository-frontend:latest
    ports:
      - "4200:80"
    networks:
      - monitoring

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=""
      - MYSQL_DATABASE=projet
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  mysql-data:
