version: '3.8'

  services:
    backend:
      image: assilhammami/devopsrepository:latest
      ports:
        - "8089:8089"
      depends_on:
        mysql:
          condition: service_healthy
      environment:
        - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/projet?createDatabaseIfNotExist=true
        - SPRING_DATASOURCE_USERNAME=root
        - SPRING_DATASOURCE_PASSWORD=""
        - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      networks:
        - monitoring

    frontend:
      image: assilhammami/devopsrepository-frontend:latest
      ports:
        - "4200:80"
      networks:
        - monitoring

    mysql:
      image: mysql:8.0
      environment:
        - MYSQL_ROOT_PASSWORD=""
        - MYSQL_DATABASE=projet
        - MYSQL_ALLOW_EMPTY_PASSWORD=true
      ports:
        - "3306:3306"
      volumes:
        - mysql-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - monitoring

    prometheus:
      image: prom/prometheus
      ports:
        - "9090:9090"
      volumes:
        - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      networks:
        - monitoring

    grafana:
      image: grafana/grafana
      ports:
        - "3001:3000"  # Changed from 3000:3000 to 3001:3000
      networks:
        - monitoring

    jenkins:
      image: jenkins/jenkins:lts
      ports:
        - "8080:8080"
        - "50000:50000"
      volumes:
        - jenkins-data:/var/jenkins_home
      networks:
        - monitoring

    nexus:
      image: sonatype/nexus3
      ports:
        - "8081:8081"
      volumes:
        - nexus-data:/nexus-data
      networks:
        - monitoring

    sonarqube:
      image: sonarqube:latest
      ports:
        - "9000:9000"
      volumes:
        - sonarqube-data:/opt/sonarqube/data
        - sonarqube-logs:/opt/sonarqube/logs
      networks:
        - monitoring

  networks:
    monitoring:
      driver: bridge

  volumes:
    mysql-data:
    jenkins-data:
    nexus-data:
    sonarqube-data:
    sonarqube-logs:
