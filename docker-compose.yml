version: '3.8'

services:
  backend:
    image: assilhammami/devopsrepository:latest
    ports:
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/projet?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=""  # Set to empty string to match MySQL root password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  frontend:
    image: assilhammami/devopsrepository-frontend:latest
    ports:
      - "4200:80"  # Map host port 4200 to container port 80 (NGINX default)

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=""  # Set empty root password
      - MYSQL_DATABASE=projet
      - MYSQL_ALLOW_EMPTY_PASSWORD=true  # Explicitly allow empty password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

volumes:
  mysql-data: