version: '3.8'
services:
  backend:
    image: assilhammami/devopsrepository:latest
    ports:
      - "8089:8089"
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/projet?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=assil
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  frontend:
    image: assilhammami/devopsrepository-frontend:latest
    ports:
      - "4200:4200"

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=assil
      - MYSQL_DATABASE=projet
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

volumes:
  mysql-data: