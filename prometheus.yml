global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['172.21.55.49:9090']
  - job_name: 'jenkins'
    scrape_interval: 15s
    scrape_timeout: 30s
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['172.21.55.49:8080']
    basic_auth:
      username: admin
      password: 404955205d2146c28cdee7c9238fbc7d
  - job_name: 'nexus'
    scrape_interval: 15s
    scrape_timeout: 30s
    metrics_path: '/service/metrics/prometheus'
    static_configs:
      - targets: ['172.21.55.49:8081']
    basic_auth:
      username: jenkins
      password: admin
  - job_name: 'sonarqube'
    scrape_interval: 15s
    scrape_timeout: 30s
    metrics_path: '/api/monitoring/metrics'
    static_configs:
      - targets: ['172.21.55.49:9000']
    basic_auth:
      username: admin
      password: 99510097Mm@aa
  - job_name: 'spring-boot'
    scrape_interval: 15s
    scrape_timeout: 30s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.21.55.49:8089']
